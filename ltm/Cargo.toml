[package]
name = "vivy-memory"
version = "0.1.0"
edition = "2021"
license = "BSL-1.1"
description = "Local, durable, namespace-isolated long-term memory for AI agents"

[dependencies]
vivy-core = { version = "0.1.0", path = "../vec" }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
log = "0.4"

[dev-dependencies]
tempfile = "3"
